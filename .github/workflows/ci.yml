name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs on the same branch/PR — the latest push is the only
# one we care about.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # DuckDB observability has native bindings and is dev-only. CI just needs
      # the build to succeed; the primary LibSQL store is enough.
      DISABLE_OBSERVABILITY_STORE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pin to the engines field in package.json so CI never drifts
          # off the local dev version.
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Build (no LLM key — getAuditModel is lazy)
        run: npm run build
